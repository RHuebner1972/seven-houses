name: api-tests

on:
  push:
    branches: [main, "feature/**"]
    paths: ["api/**", ".github/workflows/api-tests.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    # A Postgres service container is simpler and free. A Neon-branch variant
    # (neondatabase/create-branch-action with NEON_API_KEY / NEON_PROJECT_ID)
    # can replace it later if tests need production-like Postgres behaviour.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sh
          POSTGRES_PASSWORD: sh
          POSTGRES_DB: seventh_house_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sh -d seventh_house_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sh:sh@localhost:5432/seventh_house_test
      ENV: test
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -W error -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check api/
